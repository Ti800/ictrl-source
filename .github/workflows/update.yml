name: Update iCTRL source
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate source
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: ${{ github.repository }}
        run: python3 gen.py ictrl-source.json
      # runs even when health checks failed, so whatever did succeed is published
      - name: Commit if changed
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add ictrl-source.json mirror-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update iCTRL source $(python3 -c "import json;print(json.load(open('ictrl-source.json'))['apps'][0]['version'])")"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45*86400)) ]; then
            # keep the scheduled workflow alive (GitHub disables it after 60 idle days)
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "no change"
          fi
